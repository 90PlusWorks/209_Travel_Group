<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellenbosch University - 209 Travel Group - Request Form</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --bg: #f8f9fa;
      --text: #61223B;
      --muted: #5f6368;
      --success: #137333;
      --card: #B79962;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 12px 10px 24px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin-bottom: 2px; }
    .subtitle { color: var(--muted); margin-bottom: 10px; font-size: 0.85rem; }
    .load-status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 1.2em;
    }
    .load-status.ok { color: var(--success); }
    .load-status.err { color: #c5221f; }
    .flight-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .flight-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .flight-header h2 { font-size: 1rem; }
    .remove-btn {
      background: none; border: none; color: #d93025;
      cursor: pointer; font-size: 0.8rem; padding: 2px 6px;
    }
    .remove-btn:hover { text-decoration: underline; }
    .section { margin-bottom: 10px; }
    .section-title {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px;
    }
    .grid-3 { display: grid; grid-template-columns: 1.1fr 0.9fr 1.2fr; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block; font-size: 0.75rem; font-weight: 500;
      margin-bottom: 2px; color: var(--muted);
    }
    select, input[type="date"], input[type="time"], input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.875rem; background: #fff;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 4.5em; }
    select:focus, input:focus, textarea:focus {
      outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent;
    }
    .country-search-wrap input { margin-bottom: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    button {
      font-size: 0.875rem; font-weight: 500; padding: 8px 14px;
      border-radius: 6px; border: none; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled,
    .btn-secondary:disabled { background: #9aa0a6; color: #fff; cursor: not-allowed; border: none; }
    .btn-secondary {
      background: #fff; color: var(--primary); border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #f1f3f4; }
    #status {
      margin-top: 14px; padding: 12px 14px; border-radius: 8px;
      background: #e6f4ea; color: var(--success); font-size: 0.875rem; display: none;
    }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stellenbosch University - 209 Travel Group - Request Form</h1>
    <p class="subtitle">Select origin &amp; destination, dates and times. Add services and comments per flight, then submit to copy the request.</p>
    <div class="load-status" id="loadStatus">Loading airports…</div>

    <div class="flight-card" id="tripDefaults">
  <div class="section-title">Travellers</div>

  <div class="grid-2">
    <div class="field">
      <label for="pax_count">Number of passengers</label>
      <input type="number" id="pax_count" min="1" value="1">
    </div>

    <div class="field">
      <label for="contact_email">Contact email</label>
      <input type="email" id="contact_email"
             placeholder="name@sun.ac.za" autocomplete="email">
    </div>
  </div>

  <div id="passenger_fields"></div>
</div>

<script>
  const passengerCount = document.getElementById("pax_count");
  const passengerFields = document.getElementById("passenger_fields");

  function renderPassengerFields() {
    const count = Math.max(1, parseInt(passengerCount.value, 100) || 1);
    passengerFields.replaceChildren();

    for (let i = 1; i <= count; i++) {
      const section = document.createElement("div");
      section.className = "passenger-details";

      section.innerHTML = `
        <div class="section-title">Passenger ${i}</div>
        <div class="grid-2">
          <div class="field">
            <label for="passenger_${i}_name">Name</label>
            <input type="text" id="passenger_${i}_name"
                   name="passengers[${i}][name]" required>
          </div>
          <div class="field">
            <label for="passenger_${i}_surname">Surname</label>
            <input type="text" id="passenger_${i}_surname"
                   name="passengers[${i}][surname]" required>
          </div>
          <div class="field">
            <label for="passenger_${i}_idnr">ID number</label>
            <input type="text" id="passenger_${i}_idnr"
                   name="passengers[${i}][idnr]" required>
          </div>
        </div>
      `;

      passengerFields.appendChild(section);
    }
  }

  passengerCount.addEventListener("input", renderPassengerFields);
  renderPassengerFields();

 

  function renderPassengerFields() {
    const count = Math.max(1, parseInt(passengerCount.value, 10) || 1);
    passengerFields.replaceChildren();

    for (let i = 1; i <= count; i++) {
      const section = document.createElement("div");
      section.className = "passenger-details";

      section.innerHTML = `
        <div class="section-title">Passenger ${i}</div>
        <div class="grid-2">
          <div class="field">
            <label for="passenger_${i}_name">Name</label>
            <input type="text" id="passenger_${i}_name"
                   name="passengers[${i}][name]" required>
          </div>
          <div class="field">
            <label for="passenger_${i}_surname">Surname</label>
            <input type="text" id="passenger_${i}_surname"
                   name="passengers[${i}][surname]" required>
          </div>
          <div class="field">
            <label for="passenger_${i}_idnr">ID number</label>
            <input type="text" id="passenger_${i}_idnr"
                   name="passengers[${i}][idnr]" required>
          </div>
        </div>
      `;

      passengerFields.appendChild(section);
    }
  }

  passengerCount.addEventListener("input", renderPassengerFields);
  renderPassengerFields();
</script>

    <div id="flights"></div>

    <div class="actions">
      <button type="button" class="btn-secondary" id="addFlightBtn" disabled>Specify another flight</button>
      <button type="button" class="btn-primary" id="submitBtn" disabled>Submit</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    /*names(data)
 [1] "id"           "iata"         "icao"        
 [4] "type"         "name"         "lat"         
 [7] "lon"          "elevation"    "continent"   
[10] "country"      "iso_country"  "municipality"
[13] "scheduled"    "score"  */
    // ========== CONFIG ==========
    const CSV_URL = 'world-airports.csv'; //
    // ============================

    let airportsData = [];
    let allCountries = [];
    let flightCount = 0;

    function parseCSV(text) {
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n');
      if (lines.length < 2) throw new Error('CSV has no data rows');

      function splitRow(row) {
        const out = [];
        let cur = '', inQ = false;
        for (let i = 0; i < row.length; i++) {
          const c = row[i];
          if (c === '"') {
            if (inQ && row[i + 1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
          } else if (c === ',' && !inQ) {
            out.push(cur); cur = '';
          } else {
            cur += c;
          }
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      const headers = splitRow(lines[0]).map(h => h.toLowerCase().replace(/^"|"$/g, ''));
      const idxCountry = headers.indexOf('country');
      const idxCity    = headers.indexOf('municipality');
      const idxAirport = headers.indexOf('name');

      if (idxCountry < 0 || idxCity < 0 || idxAirport < 0) {
        throw new Error('CSV must have headers: country, city, airport');
      }

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = splitRow(lines[i]);
        const country = (cols[idxCountry] || '').replace(/^"|"$/g, '');
        const city    = (cols[idxCity]    || '').replace(/^"|"$/g, '');
        const airport = (cols[idxAirport] || '').replace(/^"|"$/g, '');
        if (country && city && airport) {
          rows.push({ country, city, airport });
        }
      }
      return rows;
    }

    function setData(data) {
      airportsData = data;
      allCountries = [...new Set(airportsData.map(d => d.country))].sort();
      document.getElementById('loadStatus').textContent =
        `Loaded ${airportsData.length} airports (${allCountries.length} countries)`;
      document.getElementById('loadStatus').className = 'load-status ok';
      document.getElementById('addFlightBtn').disabled = false;
      document.getElementById('submitBtn').disabled = false;

      document.getElementById('flights').innerHTML = '';
      flightCount = 0;
      addFlight();
    }

    function getCitiesForCountry(country) {
      return [...new Set(airportsData.filter(d => d.country === country).map(d => d.city))].sort();
    }

    function getAirportsForCity(country, city) {
      return airportsData
        .filter(d => d.country === country && d.city === city)
        .map(d => d.airport)
        .sort();
    }

    function createLocationBlock(prefix, flightId) {
      const id = `${prefix}_${flightId}`;
      return `
        <div class="section">
          <div class="section-title">${prefix === 'origin' ? 'Origin' : 'Destination'}</div>
          <div class="grid-3">
            <div class="field country-search-wrap">
              <label>Country - Filter, then click the dropdown</label>
              <input type="text" id="${id}_country_search" placeholder="Filter (e.g. Sou...) then click dropdown" autocomplete="off">
              <select id="${id}_country"><option value="">— Country —</option></select>
            </div>
            <div class="field">
              <label>City</label>
              <select id="${id}_city" disabled><option value="">— City —</option></select>
            </div>
            <div class="field">
              <label>Airport</label>
              <select id="${id}_airport" disabled><option value="">— Airport —</option></select>
            </div>
          </div>
        </div>`;
    }

    function createFlightCard(id) {
      const card = document.createElement('div');
      card.className = 'flight-card';
      card.dataset.flightId = id;
      card.innerHTML = `
        <div class="flight-header">
          <h2>Flight ${id}</h2>
          ${id > 1 ? `<button type="button" class="remove-btn" data-remove="${id}">Remove</button>` : ''}
        </div>
        ${createLocationBlock('origin', id)}
        ${createLocationBlock('destination', id)}

        <div class="section">
          <div class="grid-2">
            <div>
              <div class="section-title">Departure</div>
              <div class="grid-2">
                <div class="field">
                  <label>Date</label>
                  <input type="date" id="dep_date_${id}">
                </div>
                <div class="field">
                  <label>Time</label>
                  <input type="time" id="dep_time_${id}">
                </div>
              </div>
            </div>
            <div>
              <div class="section-title">Arrival (before)</div>
              <div class="grid-2">
                <div class="field">
                  <label>Date</label>
                  <input type="date" id="arr_date_${id}">
                </div>
                <div class="field">
                  <label>Time</label>
                  <input type="time" id="arr_time_${id}">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Cabin &amp; services</div>
          <div class="grid-2">
            <div class="field">
              <label>Cabin class</label>
              <select id="cabin_${id}">
                <option value="Economy">Economy</option>
                <option value="Premium Economy">Premium Economy</option>
                <option value="Business">Business</option>
                <option value="First Class">First Class</option>
              </select>
            </div>
            <div class="field">
              <label>Meal preference</label>
              <select id="meal_${id}">
                <option value="Standard">Standard (no special meal)</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Vegan">Vegan</option>
                <option value="Hindu">Hindu</option>
                <option value="Kosher">Kosher</option>
                <option value="Muslim">Muslim</option>
                <option value="Gluten-free">Gluten-free</option>
                <option value="Diabetic">Diabetic</option>
                <option value="Other">Other (see comments)</option>
              </select>
            </div>
            <div class="field">
              <label>Special assistance</label>
              <select id="assistance_${id}">
                <option value="None">None</option>
                <option value="Wheelchair (to aircraft)">Wheelchair (to aircraft)</option>
                <option value="Wheelchair (up steps)">Wheelchair (up steps)</option>
                <option value="Wheelchair (to seat)">Wheelchair (to seat)</option>
                <option value="Visually impaired">Visually impaired / blind</option>
                <option value="Hearing impaired">Hearing impaired / deaf</option>
                <option value="Other">Other (see comments)</option>
              </select>
            </div>
            <div class="field">
              <label>Special luggage</label>
              <select id="luggage_${id}">
                <option value="None">None / standard only</option>
                <option value="Excess baggage">Excess baggage</option>
                <option value="Sports equipment">Sports equipment</option>
                <option value="Musical instrument">Musical instrument</option>
                <option value="Mobility device">Mobility device / wheelchair as bag</option>
                <option value="Other">Other (see comments)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Additional comments</div>
          <div class="field">
            <label for="comments_${id}">Notes for this flight (assistance detail, bag size/weight, airline preference, etc.)</label>
            <textarea id="comments_${id}" rows="3" placeholder="e.g. folding wheelchair, 1× golf bag under 23 kg, prefer direct if possible…"></textarea>
          </div>
        </div>`;
      return card;
    }

    function populateCountrySelect(selectEl, filterText = '') {
      const filter = filterText.trim().toLowerCase();
      const filtered = filter
        ? allCountries.filter(c => c.toLowerCase().includes(filter))
        : allCountries;

      const previous = selectEl.value;
      selectEl.innerHTML = '<option value="">— Country —</option>';
      filtered.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        selectEl.appendChild(opt);
      });

      if (filtered.includes(previous)) {
        selectEl.value = previous;
      } else if (filter && filtered.length > 0) {
        // jump to first match (e.g. "sou" → South Africa); focus stays in search box
        selectEl.value = filtered[0];
      } else {
        selectEl.value = '';
      }
    }

    function setupLocationCascades(prefix, flightId) {
      const id = `${prefix}_${flightId}`;
      const searchInput = document.getElementById(`${id}_country_search`);
      const countrySelect = document.getElementById(`${id}_country`);
      const citySelect = document.getElementById(`${id}_city`);
      const airportSelect = document.getElementById(`${id}_airport`);

      populateCountrySelect(countrySelect);

      searchInput.addEventListener('input', () => {
        populateCountrySelect(countrySelect, searchInput.value);
        // reload cities for auto-selected / cleared country — do not open the select
        countrySelect.dispatchEvent(new Event('change'));
      });

      countrySelect.addEventListener('change', () => {
        const country = countrySelect.value;
        citySelect.innerHTML = '<option value="">— City —</option>';
        airportSelect.innerHTML = '<option value="">— Airport —</option>';
        airportSelect.disabled = true;

        if (country) {
          getCitiesForCountry(country).forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            citySelect.appendChild(opt);
          });
          citySelect.disabled = false;
        } else {
          citySelect.disabled = true;
        }
      });

      citySelect.addEventListener('change', () => {
        const country = countrySelect.value;
        const city = citySelect.value;
        airportSelect.innerHTML = '<option value="">— Airport —</option>';

        if (country && city) {
          const airports = getAirportsForCity(country, city);
          airports.forEach(ap => {
            const opt = document.createElement('option');
            opt.value = ap;
            opt.textContent = ap;
            airportSelect.appendChild(opt);
          });
          airportSelect.disabled = false;
          if (airports.length === 1) airportSelect.value = airports[0];
        } else {
          airportSelect.disabled = true;
        }
      });
    }

    function addFlight() {
      flightCount += 1;
      const card = createFlightCard(flightCount);
      document.getElementById('flights').appendChild(card);
      setupLocationCascades('origin', flightCount);
      setupLocationCascades('destination', flightCount);
      const removeBtn = card.querySelector('[data-remove]');
      if (removeBtn) {
        removeBtn.addEventListener('click', () => {
          card.remove();
          renumberFlights();
        });
      }
    }

    function renumberFlights() {
      document.querySelectorAll('#flights .flight-card').forEach((card, index) => {
        card.querySelector('h2').textContent = `Flight ${index + 1}`;
      });
    }

    function formatLocation(prefix, flightId) {
      const country = document.getElementById(`${prefix}_${flightId}_country`)?.value || '';
      const city    = document.getElementById(`${prefix}_${flightId}_city`)?.value || '';
      const airport = document.getElementById(`${prefix}_${flightId}_airport`)?.value || '';
      if (!country || !city || !airport) return null;
      return `${airport}, ${city}, ${country}`;
    }

    function buildClipboardText() {
      const cards = Array.from(document.querySelectorAll('#flights .flight-card'));
      const lines = [];
      cards.forEach((card, index) => {
        const id = card.dataset.flightId;
        const origin = formatLocation('origin', id);
        const dest   = formatLocation('destination', id);
        if (!origin || !dest) return;

        const depDate  = document.getElementById(`dep_date_${id}`)?.value || '—';
        const depTime  = document.getElementById(`dep_time_${id}`)?.value || '—';
        const arrDate  = document.getElementById(`arr_date_${id}`)?.value || '—';
        const arrTime  = document.getElementById(`arr_time_${id}`)?.value || '—';
        const cabin    = document.getElementById(`cabin_${id}`)?.value || 'Economy';
        const meal     = document.getElementById(`meal_${id}`)?.value || 'Standard';
        const assist   = document.getElementById(`assistance_${id}`)?.value || 'None';
        const luggage  = document.getElementById(`luggage_${id}`)?.value || 'None';
        const comments = (document.getElementById(`comments_${id}`)?.value || '').trim();

        let line =
          `${index + 1}. On ${depDate}, ${depTime} from ${origin} to ${dest} ` +
          `to arrive before ${arrDate}, ${arrTime} — ${cabin}`;
        line += `\n   Meal: ${meal} | Assistance: ${assist} | Luggage: ${luggage}`;
        if (comments) line += `\n   Comments: ${comments}`;
        lines.push(line);
      });
      if (!lines.length) return null;

      const pax = document.getElementById('pax_count')?.value || '1';
      const email = (document.getElementById('contact_email')?.value || '').trim();
      let header = `Please quote for the following flights (${pax} passenger(s)):\n`;
      if (email) header += `Contact: ${email}\n`;
      return header + lines.join('\n');
    }

    function scrollToStatus() {
      const status = document.getElementById('status');
      status.scrollIntoView({ behavior: 'smooth', block: 'end' });
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function loadCSV() {
      const statusEl = document.getElementById('loadStatus');
      statusEl.textContent = 'Loading airports…';
      statusEl.className = 'load-status';
      try {
        const res = await fetch(CSV_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const text = await res.text();
        const data = parseCSV(text);
        if (!data.length) throw new Error('No valid rows in CSV');
        setData(data);
      } catch (err) {
        statusEl.textContent = 'Failed to load airports: ' + err.message;
        statusEl.className = 'load-status err';
        document.getElementById('addFlightBtn').disabled = true;
        document.getElementById('submitBtn').disabled = true;
      }
    }

    document.getElementById('addFlightBtn').addEventListener('click', addFlight);

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const text = buildClipboardText();
      const status = document.getElementById('status');
      if (!text) {
        status.textContent = 'Please complete at least one flight (origin and destination).';
        status.style.background = '#fce8e6';
        status.style.color = '#c5221f';
        status.classList.add('show');
        scrollToStatus();
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      status.textContent = 'Your detail was captured in your clipboard. Paste (using CTRL-V or your mouse right-click) your request to the travel agency email.';
      status.style.background = '#e6f4ea';
      status.style.color = 'var(--success)';
      status.classList.add('show');
      scrollToStatus();
    });

    loadCSV();
  </script>
</body>
</html>
